<!doctype html>
<html lang="pl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06061C" />
    <meta name="description" content="Rejestry i VAT — prototyp demonstracyjny" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" />
    <title>Obszary księgowe</title>
    <script>
      // The app is dark unless the visitor has chosen the light theme. Apply
      // that choice before first paint so the page never flashes. (The older
      // "theme" key belonged to earlier palettes and is dropped, so nobody is
      // left in a theme they did not pick here.)
      try {
        localStorage.removeItem("theme")
        if (localStorage.getItem("motyw") === "light") {
          document.documentElement.dataset.theme = "light"
          document.querySelector('meta[name="theme-color"]').content = "#E9E5FF"
        }
      } catch (e) {}
      // The app opens with its cards being dealt (src/lib/deck.ts). Hold the
      // page back from the first paint so it is never seen before the deck;
      // if the app fails to start, give it back after a few seconds.
      try {
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches && Element.prototype.animate) {
          document.documentElement.dataset.deck = "held"
          setTimeout(function () {
            if (!document.querySelector(".deck-layer")) delete document.documentElement.dataset.deck
          }, 6000)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
