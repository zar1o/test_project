<!doctype html>
<html lang="pl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#CFE9F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#081311" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Rejestry i VAT — prototyp demonstracyjny" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" />
    <title>Obszary księgowe</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      try {
        var t = localStorage.getItem("theme")
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
